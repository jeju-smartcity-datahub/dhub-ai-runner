# dhub2-runner on Kubernetes: the web app runs each pipeline run as a Job and
# each agent as a Deployment + Service, all from the same image.
#
# Needs, outside this file: RustFS (or any S3-compatible storage) and Postgres.
# Fill in runner-env and runner-config, then:
#   kubectl apply -n <namespace> -f deploy/k8s/runner.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dhub2-runner
---
# The web app creates and removes the run Jobs and agent pods in its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dhub2-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dhub2-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dhub2-runner
subjects:
  - kind: ServiceAccount
    name: dhub2-runner
---
# Infrastructure credentials only. Secrets of pipelines and agents are entered
# in the UI and kept, encrypted, in Postgres.
apiVersion: v1
kind: Secret
metadata:
  name: runner-env
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
  RUNNER_DATABASE_URL: postgresql://runner:change-me@postgres:5432/runner
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  RUNNER_SECRET_KEY: change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
data:
  AWS_ENDPOINT_URL: http://rustfs:9000
  AWS_REGION: us-east-1
  RUNNER_COLLECTIONS: s3://dhub-runner/collections
  RUNNER_TABLES: s3://dhub-runner/tables
  RUNNER_EXECUTOR: kubernetes
  RUNNER_K8S_IMAGE: dhub2-runner:latest
  RUNNER_K8S_SERVICE_ACCOUNT: default
  # What the run and agent pods get, as the web app does.
  RUNNER_K8S_ENV_FROM: secret/runner-env,configmap/runner-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhub2-runner-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: dhub2-runner-web}
  template:
    metadata:
      labels: {app: dhub2-runner-web}
    spec:
      serviceAccountName: dhub2-runner
      containers:
        - name: web
          image: dhub2-runner:latest
          args: ["web", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: RUNNER_K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          envFrom:
            - secretRef: {name: runner-env}
            - configMapRef: {name: runner-config}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            httpGet: {path: /api/collections, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: dhub2-runner-web
spec:
  selector: {app: dhub2-runner-web}
  ports: [{name: http, port: 80, targetPort: 8080}]
