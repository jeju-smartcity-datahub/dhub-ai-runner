[project]
name = "dhub-runner"
version = "0.1.0"
description = "Run pipelines and agents built in D.Hub for AI, standalone"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "croniter>=6.0",
    "cryptography>=42",
    "deltalake>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "polars>=1.30",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
dhub-runner = "cli:main"

[project.optional-dependencies]
k8s = [
    "kubernetes>=29",
]

[dependency-groups]
dev = ["moto[server]>=5", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend"]
sources = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
