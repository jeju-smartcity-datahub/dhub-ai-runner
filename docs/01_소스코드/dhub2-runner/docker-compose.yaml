# dhub2-runner with its configuration and data on RustFS (S3-compatible).
#
#   docker compose up -d --build
#     rustfs    object storage: s3://dhub-runner/collections/<name>, s3://dhub-runner/tables/<name>
#     postgres  the secret store (values encrypted with RUNNER_SECRET_KEY before they are stored)
#               and the dataset catalog (schema, statistics, history, lineage, notes)
#     web       UI and API on http://localhost:8080 — import collections, run pipelines,
#               browse datasets and chat with agents; runs scheduled pipelines too
#
#   docker compose --profile headless up -d --build
#     also runs one collection without the UI (COLLECTION_DIR uploaded as COLLECTION_NAME):
#     collection-init uploads it, agent-runner serves its agents on :8000 (OpenAI API),
#     pipeline-runner runs its scheduled pipelines. They read the secrets of the
#     collection COLLECTION_NAME (and the shared ones) from the same Postgres.
#
# Only infrastructure is configured through environment variables (RustFS,
# Postgres, RUNNER_SECRET_KEY); secrets are entered in the UI or with
# `docker compose exec web dhub2-runner secret set <secret>/<key>`.
#
# Run state (step checkpoints, run history, agent sessions) stays in the
# runner-data volume.

x-s3: &s3
  AWS_ENDPOINT_URL: http://rustfs:9000
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
  AWS_REGION: us-east-1

x-secrets: &secrets
  RUNNER_DATABASE_URL: postgresql://runner:${POSTGRES_PASSWORD:-runner}@postgres:5432/runner
  RUNNER_SECRET_KEY: ${RUNNER_SECRET_KEY:-}

x-runner: &runner
  build: .
  image: dhub2-runner:local
  env_file:
    - path: .env
      required: false
  volumes:
    - runner-data:/data

services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runner}
      POSTGRES_DB: runner
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "runner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *runner
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: [*s3, *secrets]
      RUNNER_COLLECTIONS: s3://dhub-runner/collections
      RUNNER_TABLES: s3://dhub-runner/tables
    ports:
      - "8080:8080"
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  collection-init:
    <<: *runner
    profiles: ["headless"]
    command: ["collection", "push", "/seed"]
    environment:
      <<: *s3
      RUNNER_COLLECTION_DIR: s3://dhub-runner/collections/${COLLECTION_NAME:-quickstart}
    volumes:
      - ${COLLECTION_DIR:-./examples/quickstart}:/seed:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  agent-runner:
    <<: *runner
    profiles: ["headless"]
    command: ["agent", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*s3, *secrets]
      RUNNER_COLLECTION_DIR: s3://dhub-runner/collections/${COLLECTION_NAME:-quickstart}
      RUNNER_TABLES: s3://dhub-runner/tables/${COLLECTION_NAME:-quickstart}
      RUNNER_COLLECTION: ${COLLECTION_NAME:-quickstart}
    ports:
      - "8000:8000"
    depends_on:
      collection-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pipeline-runner:
    <<: *runner
    profiles: ["headless"]
    command: ["pipeline", "serve"]
    environment:
      <<: [*s3, *secrets]
      RUNNER_COLLECTION_DIR: s3://dhub-runner/collections/${COLLECTION_NAME:-quickstart}
      RUNNER_TABLES: s3://dhub-runner/tables/${COLLECTION_NAME:-quickstart}
      RUNNER_COLLECTION: ${COLLECTION_NAME:-quickstart}
    depends_on:
      collection-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rustfs-data:
  postgres-data:
  runner-data:
